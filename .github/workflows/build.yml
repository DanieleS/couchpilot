name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Needed to publish the .pext as a release asset on tags.
permissions:
  contents: write

jobs:
  # The gallery's ffmpeg.exe, cross-built on Linux. Slow (a few minutes), so cached until the
  # script changes.
  ffmpeg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: cache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-out
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nasm meson ninja-build autoconf automake libtool pkg-config
          scripts/build-ffmpeg.sh build/ffmpeg build/ffmpeg-out

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg
          path: build/ffmpeg-out

  build:
    needs: ffmpeg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: src/CouchPilot/ffmpeg

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build extension
        run: dotnet build src/CouchPilot/CouchPilot.csproj -c Release

      # A .pext is just a zip of the extension folder; Playnite installs it on double-click.
      - name: Package .pext
        shell: pwsh
        run: |
          $version = (Select-String -Path src/CouchPilot/extension.yaml -Pattern '^Version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $out = "src/CouchPilot/bin/Release"
          Remove-Item "$out/*.pdb" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$out/*" -DestinationPath "dist/CouchPilot_$version.zip" -Force
          Move-Item "dist/CouchPilot_$version.zip" "dist/CouchPilot_$version.pext" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: CouchPilot
          path: dist/*.pext

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pext
